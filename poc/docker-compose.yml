# PostgreSQL para execução manual no perfil local (./mvnw spring-boot:run -Dspring-boot.run.profiles=local).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 2s
      timeout: 3s
      retries: 15
