# Build e testes da PoC de Pedidos (poc/CLAUDE.md, seção 8; FF-11 a FF-16).
name: poc

on:
  pull_request:
    paths:
      - "poc/**"
      - ".github/workflows/poc.yml"
  push:
    paths:
      - "poc/**"
      - ".github/workflows/poc.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build e testes (FF-11, FF-13 a FF-15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers usa o Docker do runner.
      - name: ./mvnw verify
        run: ./mvnw -B verify

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            poc/target/surefire-reports/
            poc/target/failsafe-reports/
          if-no-files-found: warn

  dependency-review:
    name: Revisão de dependências (FF-16)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  codeql:
    name: CodeQL Java (FF-16)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # Só compila: os testes já rodam no job build.
      - name: Compilar para análise
        working-directory: poc
        run: ./mvnw -B -DskipTests package

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
